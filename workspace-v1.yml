---
quickStartVariants:
  - name: Quick Start With Demo Data
    snapshot: community-demo-data-2026.2
  - name: Quick Start Without Demo Data
snapshots:
  - id: community-demo-data-2026.2
    name: Demo Data 2026.2
    url: https://github.com/Citeck/citeck-launcher/releases/download/v2.4.0/2026.2-demo-data.zip
    size: 66.4m
    sha256: 7a1fc5a0b8b176caa9a7690282d6f7629bd498332cc793f588b4c0ebedbf4cce
  - id: community-demo-data-2025.12
    name: Demo Data 2025.12
    url: https://github.com/Citeck/citeck-launcher/releases/download/v1.3.5/2025.12-demo-data.zip
    size: 66.4m
    sha256: 7217aa83236018517619598d3ff98e534ea0fc41afb1ce5290fef544f577ac4d
namespaceTemplates:
  - id: default
    name: Default
    detachedApps:
      # Optional apps a bundle may ship: generated, but not started by the
      # launcher itself. A companion is listed WITH its owner — otherwise a
      # stand with the owner switched off still pays for the companion.
      - rag
      - qdrant
      - stt-sidecar
      - observer
      - observer-postgres
    config:
      bundleRef: 'community:LATEST'
      authentication:
        type: KEYCLOAK
imageRepos:
  - id: core
    url: nexus.citeck.ru
  - id: enterprise
    url: harbor.citeck.ru/enterprise
    authType: BASIC
bundleRepos:
  - id: community
    name: Community Bundles
    url: https://github.com/Citeck/launcher-workspace.git
    branch: main
    path: community
  - id: enterprise
    name: Enterprise Bundles
    url: https://github.com/Citeck/launcher-workspace.git
    branch: main
    path: enterprise
  - id: community-rc
    name: Community Release Candidates Bundles
    url: https://github.com/Citeck/launcher-workspace.git
    branch: main
    path: community-rc
  - id: enterprise-rc
    name: Enterprise Release Candidates Bundles
    url: https://github.com/Citeck/launcher-workspace.git
    branch: main
    path: enterprise-rc
citeckProxy:
  aliases: [ 'EcosProxyApp' ]
# The observer and its database are configuration: the launcher has no code
# for them (2.15+). Whether a stand has them is the bundle's answer — it names
# the `observer` and `observer-postgres` images. The reference copy of this
# block lives in the launcher repository,
# internal/namespace/testdata/observer-workspace.yml; keep the two identical.
# Launchers before 2.15 do not understand it, drop `additionalApps` as a whole
# and run their built-in observer instead.
secrets:
  # Default for the observer's database password; each namespace stores its
  # own copy the first time and keeps it (the password lives in the volume).
  - id: observer-db
    value: observer
additionalApps:
  - name: observer-postgres
    type: POSTGRES
    user: observer
    db: observer
    password: ${secret:observer-db}
    # Published in desktop mode, so an observer run from an IDE reaches it.
    port: 14524
    # The volume name IS how the data is found — never change it.
    volumeBase: obs_postgres
    memoryLimit: 512m
    # Tuned for the observability workload: heavy writes (span/metric
    # ingestion), aggregating queries, JSONB GIN lookups.
    settings:
      shared_buffers: 256MB
      work_mem: 32MB
      maintenance_work_mem: 128MB
      effective_cache_size: 1GB
      random_page_cost: "1.1"
      checkpoint_completion_target: "0.9"
      wal_buffers: 16MB
      max_wal_size: 1GB
      min_wal_size: 256MB
  - name: observer
    # No image: the bundle names it. Ports 17014-17017 sit between the Keycloak
    # management port (17013) and the ZooKeeper admin port (17018).
    dependsOn: [observer-postgres, zookeeper]
    environments:
      SERVER_MODE: dev
      SERVER_PORT: "17016"
      OTLP_GRPC_PORT: "17017"
      OTLP_HTTP_PORT: "17015"
      LOG_RECEIVER_UDP_PORT: "17014"
      DATABASE_HOST: observer-postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: observer
      DATABASE_USER: observer
      DATABASE_PASSWORD: ${secret:observer-db}
      DATABASE_TLS_SSL_MODE: disable
      ZOOKEEPER_HOSTS: ${ZK_HOST}:${ZK_PORT}
      DISCOVERY_HOST: observer
      DISCOVERY_APP_NAME: observer
      AUTH_JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: "*"
      RMQ_MONITOR_ENABLED: "true"
      RMQ_MONITOR_URL: http://${RMQ_HOST}:15672
      RMQ_MONITOR_USER: ${RMQ_USER}
      RMQ_MONITOR_PASSWORD: ${RMQ_PASSWORD}
      PG_MONITOR_ENABLED: "true"
      PG_MONITOR_TARGETS: '[{"name":"citeck","host":"${PG_HOST}","port":${PG_PORT},"user":"postgres","password":"postgres"}]'
      ZK_MONITOR_ENABLED: "true"
      ZK_MONITOR_HOSTS: ${ZK_HOST}:${ZK_PORT}
    ports: ["17016:17016", "17017:17017", "17015:17015", "17014:17014/udp"]
    startupConditions:
      - probe:
          http: {path: /health, port: 17016}
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
    livenessProbe:
      http: {path: /health, port: 17016}
      failureThreshold: 7
      timeoutSeconds: 5
    resources:
      limits: {memory: 512m}
    # What CloudConfigServer hands an observer stopped here and run from an IDE.
    cloudConfig:
      server.port: 17016
      otlp.grpc_port: 17017
      otlp.http_port: 17015
      log_receiver.udp_port: 17014
      database.host: localhost
      database.port: 14524
      database.name: observer
      database.user: observer
      database.password: ${secret:observer-db}
      database.tls.ssl_mode: disable
      zookeeper.hosts: localhost:2181
      auth.jwt_secret: ${JWT_SECRET}
      rmq_monitor.enabled: true
      rmq_monitor.url: http://localhost:15672
      rmq_monitor.user: ${RMQ_USER}
      rmq_monitor.password: ${RMQ_PASSWORD}
      zk_monitor.enabled: true
      zk_monitor.hosts: localhost:2181
      pg_monitor.enabled: true
defaultWebappProps:
  heapSize: "256m"
  memoryLimit: "1g"
webapps:
  - id: eproc
    aliases: [ 'EcosProcessApp' ]
    defaultProps:
      heapSize: 1g
      memoryLimit: 2g
      dataSources:
        camunda:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_camunda"
          xa: true
        eproc:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_eproc"
          xa: true
        main-mongodb:
          url: "mongodb://${MONGO_HOST}:${MONGO_PORT}/citeck_eproc"
  - id: emodel
    aliases: [ 'EcosModelApp' ]
    defaultProps:
      heapSize: 500m
      memoryLimit: 1300m
      environments:
        ECOS_INTEGRATIONS_ONLYOFFICE_HOST: "${ONLYOFFICE_HOST}"
        ECOS_INTEGRATIONS_KEYCLOAKADMIN_ENABLED: "${KK_ENABLED}"
        ECOS_INTEGRATIONS_KEYCLOAKADMIN_URL: "${KK_ADMIN_URL}"
        ECOS_INTEGRATIONS_KEYCLOAKADMIN_USER: "${KK_ADMIN_USER}"
        ECOS_INTEGRATIONS_KEYCLOAKADMIN_PASSWORD: "${KK_ADMIN_PASSWORD}"
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_emodel"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_emodel"
          xa: true
  - id: eapps
    aliases: [ 'EcosAppsApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_eapps"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_eapps"
          xa: true
  - id: gateway
    aliases: [ 'EcosGatewayApp' ]
  - id: uiserv
    aliases: [ 'EcosUiservApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_uiserv"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_uiserv"
          xa: true
  - id: history
    aliases: [ 'EcosHistoryApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_history"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_history"
          xa: true
  - id: notifications
    aliases: [ 'EcosNotificationsApp' ]
    defaultProps:
      environments:
        SPRING_MAIL_HOST: "${MAILHOG_HOST}"
        ECOS_NOTIFICATIONS_EVENT_HOST: "${RMQ_HOST}"
        ECOS_NOTIFICATIONS_EVENT_USERNAME: "admin"
        ECOS_NOTIFICATIONS_EVENT_PASSWORD: "admin"
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_notifications"
  - id: integrations
    aliases: [ 'EcosIntegrationsApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_integrations"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_integrations"
          xa: true
  - id: transformations
    aliases: [ 'EcosTransformationsApp' ]
    defaultProps:
      heapSize: 500m
      memoryLimit: 1100m
      environments:
        ECOS_INTEGRATIONS_ONLYOFFICE_HOST: "${ONLYOFFICE_HOST}"
  - id: content
    aliases: [ 'EcosContentApp' ]
  - id: ecom
    aliases: [ 'EcosEcomApp' ]
  - id: service-desk
    aliases: [ 'EcosServiceDeskApp' ]
  - id: edi
    aliases: [ 'EcosEdiApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_edi"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_edi"
          xa: true
  - id: attorneys
    aliases: [ 'EcosPowerAttorneysApp' ]
  - id: ecos-project-tracker
    aliases: [ 'EcosProjectTrackerApp' ]
  - id: ai
    aliases: [ 'EcosAiApp' ]
  - id: rag
    aliases: [ 'EcosRagApp' ]
    defaultProps:
      heapSize: 512m
      memoryLimit: 1200m
