---
quickStartVariants:
  - name: Quick Start With Demo Data
    snapshot: community-demo-data-2026.2
  - name: Quick Start Without Demo Data
snapshots:
  - id: community-demo-data-2026.2
    name: Demo Data 2026.2
    url: https://github.com/Citeck/citeck-launcher/releases/download/v2.4.0/2026.2-demo-data.zip
    size: 66.4m
    sha256: 7a1fc5a0b8b176caa9a7690282d6f7629bd498332cc793f588b4c0ebedbf4cce
  - id: community-demo-data-2025.12
    name: Demo Data 2025.12
    url: https://github.com/Citeck/citeck-launcher/releases/download/v1.3.5/2025.12-demo-data.zip
    size: 66.4m
    sha256: 7217aa83236018517619598d3ff98e534ea0fc41afb1ce5290fef544f577ac4d
namespaceTemplates:
  - id: default
    name: Default
    detachedApps:
      # Optional apps a bundle may ship: generated, but not started by the
      # launcher itself. A companion is listed WITH its owner — otherwise a
      # stand with the owner switched off still pays for the companion. An app
      # the namespace's own configuration requires starts anyway: seaweedfs on
      # a namespace that stores its content in S3 (contentStorage below).
      - rag
      - qdrant
      - stt-sidecar
      - observer
      - observer-postgres
      - seaweedfs
    config:
      bundleRef: 'community:LATEST'
      authentication:
        type: KEYCLOAK
imageRepos:
  - id: core
    url: nexus.citeck.ru
  - id: enterprise
    url: harbor.citeck.ru/enterprise
    authType: BASIC
bundleRepos:
  - id: community
    name: Community Bundles
    url: https://github.com/Citeck/launcher-workspace.git
    branch: main
    path: community
  - id: enterprise
    name: Enterprise Bundles
    url: https://github.com/Citeck/launcher-workspace.git
    branch: main
    path: enterprise
  - id: community-rc
    name: Community Release Candidates Bundles
    url: https://github.com/Citeck/launcher-workspace.git
    branch: main
    path: community-rc
  - id: enterprise-rc
    name: Enterprise Release Candidates Bundles
    url: https://github.com/Citeck/launcher-workspace.git
    branch: main
    path: enterprise-rc
citeckProxy:
  aliases: [ 'EcosProxyApp' ]
# The observer and its database are configuration: the launcher has no code
# for them (2.15+). Whether a stand has them is the bundle's answer — it names
# the `observer` and `observer-postgres` images. The reference copy of the
# observer entries lives in the launcher repository,
# internal/namespace/testdata/observer-workspace.yml; keep the two identical.
# Launchers before 2.15 do not understand it, drop `additionalApps` as a whole
# and run their built-in observer instead.
secrets:
  # Default for the observer's database password; each namespace stores its
  # own copy the first time and keeps it (the password lives in the volume).
  - id: observer-db
    value: observer
  # SeaweedFS keys: the S3 secret key (read by the seaweedfs entry and by
  # `contentStorage.s3`) and the key its file tokens are signed with.
  # GENERATED: each namespace draws its own values the first time and keeps
  # them for good, so no stand runs on a key published here. A launcher that
  # predates generated secrets skips these entries; a namespace with no values
  # yet then gets no seaweedfs at all instead of one with an empty key. A
  # namespace restored from a snapshot into a new namespace gets new values;
  # on an S3 namespace the launcher brings the ECOS secret ecos-content
  # connects with up to the new S3 key by itself. The seaweedfs entry, these
  # secrets, the contentStorage block, the SeaweedFS link and `- seaweedfs` in
  # namespaceTemplates[default].detachedApps travel together.
  - generated: seaweedfs-s3-key
    length: 40
  - generated: seaweedfs-jwt
    length: 48
additionalApps:
  - name: observer-postgres
    type: POSTGRES
    user: observer
    db: observer
    password: ${secret:observer-db}
    # Published in desktop mode, so an observer run from an IDE reaches it.
    port: 14524
    # The volume name IS how the data is found — never change it.
    volumeBase: obs_postgres
    memoryLimit: 512m
    # Tuned for the observability workload: heavy writes (span/metric
    # ingestion), aggregating queries, JSONB GIN lookups.
    settings:
      shared_buffers: 256MB
      work_mem: 32MB
      maintenance_work_mem: 128MB
      effective_cache_size: 1GB
      random_page_cost: "1.1"
      checkpoint_completion_target: "0.9"
      wal_buffers: 16MB
      max_wal_size: 1GB
      min_wal_size: 256MB
  - name: observer
    # No image: the bundle names it. Ports 17014-17017 sit between the Keycloak
    # management port (17013) and the ZooKeeper admin port (17018).
    kind: CITECK_ADDITIONAL
    dependsOn: [observer-postgres, zookeeper]
    environments:
      SERVER_MODE: dev
      SERVER_PORT: "17016"
      OTLP_GRPC_PORT: "17017"
      OTLP_HTTP_PORT: "17015"
      LOG_RECEIVER_UDP_PORT: "17014"
      DATABASE_HOST: observer-postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: observer
      DATABASE_USER: observer
      DATABASE_PASSWORD: ${secret:observer-db}
      DATABASE_TLS_SSL_MODE: disable
      ZOOKEEPER_HOSTS: ${ZK_HOST}:${ZK_PORT}
      DISCOVERY_HOST: observer
      DISCOVERY_APP_NAME: observer
      AUTH_JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: "*"
      RMQ_MONITOR_ENABLED: "true"
      RMQ_MONITOR_URL: http://${RMQ_HOST}:15672
      RMQ_MONITOR_USER: ${RMQ_USER}
      RMQ_MONITOR_PASSWORD: ${RMQ_PASSWORD}
      PG_MONITOR_ENABLED: "true"
      PG_MONITOR_TARGETS: '[{"name":"citeck","host":"${PG_HOST}","port":${PG_PORT},"user":"postgres","password":"postgres"}]'
      ZK_MONITOR_ENABLED: "true"
      ZK_MONITOR_HOSTS: ${ZK_HOST}:${ZK_PORT}
    ports: ["17016:17016", "17017:17017", "17015:17015", "17014:17014/udp"]
    startupConditions:
      - probe:
          http: {path: /health, port: 17016}
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
    livenessProbe:
      http: {path: /health, port: 17016}
      failureThreshold: 7
      timeoutSeconds: 5
    resources:
      limits: {memory: 512m}
    # What CloudConfigServer hands an observer stopped here and run from an IDE.
    cloudConfig:
      server.port: 17016
      otlp.grpc_port: 17017
      otlp.http_port: 17015
      log_receiver.udp_port: 17014
      database.host: localhost
      database.port: 14524
      database.name: observer
      database.user: observer
      database.password: ${secret:observer-db}
      database.tls.ssl_mode: disable
      zookeeper.hosts: localhost:2181
      auth.jwt_secret: ${JWT_SECRET}
      rmq_monitor.enabled: true
      rmq_monitor.url: http://localhost:15672
      rmq_monitor.user: ${RMQ_USER}
      rmq_monitor.password: ${RMQ_PASSWORD}
      zk_monitor.enabled: true
      zk_monitor.hosts: localhost:2181
      pg_monitor.enabled: true
  # SeaweedFS: an S3-compatible store for ecos-content (Enterprise only —
  # Community has no ecos-content). Like the observer it is configuration: no
  # image here — a bundle that names `seaweedfs` in its `dependencies:` section
  # gets the container, every other bundle gets nothing. It is the provider of
  # the S3 content storage option (the top-level `contentStorage` block).
  # A namespace that stores its content in S3 (namespace.yml
  # `contentStorage: {type: S3}`) needs it: a launcher that supports
  # contentStorage starts it with that namespace whatever detachedApps says,
  # makes ecos-content wait for it and connects ecos-content to it once, by
  # itself, and keeps ecos-content's key in step with the namespace's. A
  # namespace with DB content storage — the default — does not start it on
  # its own when created from the `default` template (see detachedApps; a
  # namespace with no or another template starts it like any new app), and
  # connecting it there is an explicit step in ECOS after
  # `citeck start seaweedfs`.
  # No app in this file may `dependsOn` it: on a DB namespace it is detached,
  # and a dependent would wait for it forever (the SeaweedFS link's dependsOn
  # only greys the link out). The entry, the seaweedfs-* secrets, the
  # contentStorage block, the SeaweedFS link and the detachedApps line travel
  # together.
  - name: seaweedfs
    kind: THIRD_PARTY
    cmd:
      # `weed mini` runs master + volume + filer + S3 + the admin UI in one
      # process. It saves its flags to /data/mini.options and re-applies a
      # dropped flag once on the next start (volumeSizeLimitMB is recomputed
      # from disk instead), so keep this list COMPLETE. A saved value also
      # wins over a flag passed with its DEFAULT value (mini cannot tell the
      # two apart): a flag goes back to its default only by deleting its line
      # from mini.options. It must stay valid for the OLDEST seaweedfs tag any
      # published bundle names (4.48: -s3.readerCacheSizeMB is new in 4.48),
      # and changing it recreates seaweedfs on every stand. No credential ever
      # goes here — it would be saved into the volume with the flags; they are
      # environment variables below, which mini does not save.
      - mini
      - -dir=/data
      # A stable node identity (the default is the container IP, which changes
      # on every recreate). It does not limit binding: -ip.bind stays 0.0.0.0.
      - -ip=127.0.0.1
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=256
      # Memory bounds: the S3 download buffers (4.48 default: unlimited) and
      # the in-flight upload size (without it parallel multipart uploads
      # OOM-kill the container even at 1g; uploads beyond it are queued).
      - -s3.readerCacheSizeMB=64
      - -s3.concurrentUploadLimitMB=128
      - -webdav=false
      # Closes the filer's HTTP API (8888) AND the master's (9333: /dir/assign
      # and /dir/lookup, which hand out the tokens the volume server asks for —
      # with them open, the JWT keys below would keep no HTTP client on the
      # network out). Files are read and written through S3, and inside the
      # store through gRPC.
      - -disableHttp
      # The admin UI (23646), behind the login in WEED_ADMIN_* below. It is
      # the default, spelled out so that a newer seaweedfs with another
      # default does not take it away — and, being the default, it does not
      # beat a saved `admin.ui=false` (see above): a store volume once started
      # with -admin.ui=false keeps the UI off (the port answers 404) until
      # that line is deleted from /data/mini.options and seaweedfs restarted.
      - -admin.ui=true
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environments:
      # What each port asks for:
      # - S3 (8333): this key pair, one identity; anonymous requests are
      #   refused. The secret key is the namespace's own generated value; on
      #   an S3 namespace the launcher keeps the ECOS secret ecos-content
      #   connects with on it.
      # - filer HTTP (8888): closed by -disableHttp.
      # - volume HTTP (9340): reading or writing a file needs a token signed
      #   with the JWT key below.
      # - admin UI (23646): the WEED_ADMIN_* login below.
      # Still open to every container on the namespace network: the gRPC ports
      # (18333, 18888, 19333, 19340, 33646) — closing them takes mTLS, i.e. a
      # security.toml with certificates, which an additionalApps entry cannot
      # ship — and a few read-only pages: the master's status (/ and
      # /cluster/status on 9333), the volume server's /status, the admin
      # port's /metrics (the whole process's Prometheus metrics, per-bucket
      # traffic included) and the health checks. Server mode publishes none
      # of these ports; desktop publishes 8333 and 23646, on loopback only.
      AWS_ACCESS_KEY_ID: citeck
      AWS_SECRET_ACCESS_KEY: ${secret:seaweedfs-s3-key}
      # One generated key signs and checks the volume server's and the filer's
      # tokens, for writes and reads. Nothing keeps it in the volume, so a new
      # value — a restore into a new namespace — costs nothing.
      WEED_JWT_SIGNING_KEY: ${secret:seaweedfs-jwt}
      WEED_JWT_SIGNING_READ_KEY: ${secret:seaweedfs-jwt}
      WEED_JWT_FILER_SIGNING_KEY: ${secret:seaweedfs-jwt}
      WEED_JWT_FILER_SIGNING_READ_KEY: ${secret:seaweedfs-jwt}
      # The admin UI login: the stand's admin, as in RabbitMQ and PgAdmin
      # (admin / admin on desktop: there anything on the machine that reaches
      # 127.0.0.1:23646 — or seaweedfs:23646 on the namespace network — has
      # the whole store, generated keys or not). A password changed with
      # `citeck setup admin-password` reaches it on the next `citeck reload`,
      # which recreates the container; the files stay in the volume. Sessions
      # already open survive that, for up to 24 h: the key they are signed
      # with lives in the volume (/data/admin/.session_key) — delete it before
      # the reload to end them.
      WEED_ADMIN_USER: admin
      WEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # ecos-content's bucket, created at start. Its MinIO client needs the
      # bucket to exist before the first upload.
      S3_BUCKET: ecos-content
      GOMEMLIMIT: 512MiB
    # The volume name IS how the data is found — never change it.
    volumes: ["seaweedfs2:/data"]
    # Desktop only, on loopback: S3 (the HTTP probes go through it too) and
    # the admin UI. Server mode publishes nothing but the proxy; there the
    # admin UI is reached through an SSH tunnel (docs/content-storage.md in
    # the launcher repository).
    ports: ["8333:8333", "23646:23646"]
    startupConditions:
      - probe:
          http: {path: /healthz, port: 8333}
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
    livenessProbe:
      http: {path: /healthz, port: 8333}
      failureThreshold: 7
      timeoutSeconds: 5
    resources:
      limits: {memory: 1g}
    stopTimeout: 15
# S3 content storage: where a namespace that chose "S3 (SeaweedFS)" as its
# content storage (namespace.yml `contentStorage: {type: S3}`) keeps its
# ecos-content files. Offered only for a bundle that has ecos-content and names
# the provider's image. `app` is the additionalApps entry that serves S3; the
# rest is how ecos-content reaches it. The launcher writes exactly these values
# into the secret, endpoint and storage records it creates in ECOS, and points
# default-content-storage at that storage — once, and never over an
# administrator's choice; its own secret and endpoint it keeps on these values
# afterwards (a namespace's new S3 key reaches ECOS by itself). The reference
# copy of this block, the seaweedfs entry, its secrets and the SeaweedFS link
# lives in the launcher repository,
# internal/namespace/testdata/content-storage-workspace.yml; keep them
# identical. Launchers that do not support contentStorage ignore the key.
contentStorage:
  s3:
    app: seaweedfs
    # The product name the content storage option is labelled with:
    # "S3 (SeaweedFS)". Optional; the app id stands in for it.
    title: SeaweedFS
    # The endpoint as ecos-content reaches it: the entry's name and S3 port on
    # the namespace network.
    url: http://seaweedfs:8333
    # The entry's S3_BUCKET — the bucket it creates at start.
    bucket: ecos-content
    # The entry's AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    accessKey: citeck
    secretKey: ${secret:seaweedfs-s3-key}
# Extra links in the launcher's sidebar (desktop; server mode has no sidebar).
# A link whose dependsOn app the namespace does not have is hidden, one whose
# app is not RUNNING is shown greyed out. Launchers before 2.8 ignore the key.
links:
  # The SeaweedFS admin UI: the bucket's files, volumes, cluster state. Hidden
  # where the bundle ships no SeaweedFS, greyed out where it is detached (a
  # namespace that keeps its content in the database). It is the entry's
  # admin port, published on loopback on desktop; in server mode the same URL
  # works through an SSH tunnel (docs/content-storage.md in the launcher
  # repository). No category: a link's own category is shown untranslated.
  - name: SeaweedFS
    url: http://127.0.0.1:23646
    description: "SeaweedFS stores ecos-content files in S3.\nUsername: admin\nPassword: admin"
    dependsOn: [seaweedfs]
defaultWebappProps:
  heapSize: "256m"
  memoryLimit: "1g"
webapps:
  - id: eproc
    aliases: [ 'EcosProcessApp' ]
    defaultProps:
      heapSize: 1g
      memoryLimit: 2g
      dataSources:
        camunda:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_camunda"
          xa: true
        eproc:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_eproc"
          xa: true
        main-mongodb:
          url: "mongodb://${MONGO_HOST}:${MONGO_PORT}/citeck_eproc"
  - id: emodel
    aliases: [ 'EcosModelApp' ]
    defaultProps:
      heapSize: 500m
      memoryLimit: 1300m
      environments:
        ECOS_INTEGRATIONS_ONLYOFFICE_HOST: "${ONLYOFFICE_HOST}"
        ECOS_INTEGRATIONS_KEYCLOAKADMIN_ENABLED: "${KK_ENABLED}"
        ECOS_INTEGRATIONS_KEYCLOAKADMIN_URL: "${KK_ADMIN_URL}"
        ECOS_INTEGRATIONS_KEYCLOAKADMIN_USER: "${KK_ADMIN_USER}"
        ECOS_INTEGRATIONS_KEYCLOAKADMIN_PASSWORD: "${KK_ADMIN_PASSWORD}"
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_emodel"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_emodel"
          xa: true
  - id: eapps
    aliases: [ 'EcosAppsApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_eapps"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_eapps"
          xa: true
  - id: gateway
    aliases: [ 'EcosGatewayApp' ]
  - id: uiserv
    aliases: [ 'EcosUiservApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_uiserv"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_uiserv"
          xa: true
  - id: history
    aliases: [ 'EcosHistoryApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_history"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_history"
          xa: true
  - id: notifications
    aliases: [ 'EcosNotificationsApp' ]
    defaultProps:
      environments:
        SPRING_MAIL_HOST: "${MAILHOG_HOST}"
        ECOS_NOTIFICATIONS_EVENT_HOST: "${RMQ_HOST}"
        ECOS_NOTIFICATIONS_EVENT_USERNAME: "admin"
        ECOS_NOTIFICATIONS_EVENT_PASSWORD: "admin"
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_notifications"
  - id: integrations
    aliases: [ 'EcosIntegrationsApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_integrations"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_integrations"
          xa: true
  - id: transformations
    aliases: [ 'EcosTransformationsApp' ]
    defaultProps:
      heapSize: 500m
      memoryLimit: 1100m
      environments:
        ECOS_INTEGRATIONS_ONLYOFFICE_HOST: "${ONLYOFFICE_HOST}"
  - id: content
    aliases: [ 'EcosContentApp' ]
  - id: ecom
    aliases: [ 'EcosEcomApp' ]
  - id: service-desk
    aliases: [ 'EcosServiceDeskApp' ]
  - id: edi
    aliases: [ 'EcosEdiApp' ]
    defaultProps:
      dataSources:
        main:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_edi"
        main-xa-aware:
          url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/citeck_edi"
          xa: true
  - id: attorneys
    aliases: [ 'EcosPowerAttorneysApp' ]
  - id: ecos-project-tracker
    aliases: [ 'EcosProjectTrackerApp' ]
  - id: ai
    aliases: [ 'EcosAiApp' ]
  - id: rag
    aliases: [ 'EcosRagApp' ]
    defaultProps:
      heapSize: 512m
      memoryLimit: 1200m
